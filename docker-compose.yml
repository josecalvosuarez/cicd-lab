services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "3000:3000"   # Web UI
      - "222:22"      # SSH (avoid conflict with host SSH on 22)
    volumes:
      - gitea_data:/data
    networks:
      - cicd
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"   # Web UI
      - "50000:50000" # Agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      # Docker Desktop for Windows (WSL2 backend) exposes the socket here inside Linux containers
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd
    restart: unless-stopped

volumes:
  gitea_data:
  jenkins_home:

networks:
  cicd:
    driver: bridge
